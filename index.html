<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>AI Agent</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
    background:#07080d;
    color:#f5f7ff;
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    overflow:hidden;
}


/* =====================================================
   SIDEBAR
===================================================== */

#sidebar{
    position:fixed;
    top:0;
    right:0;
    width:290px;
    height:100%;
    z-index:100;
    background:
        linear-gradient(
            180deg,
            rgba(18,20,31,.98),
            rgba(8,9,15,.99)
        );
    border-left:1px solid rgba(255,255,255,.08);
    transform:translateX(100%);
    transition:.25s ease;
    padding:18px;
    overflow-y:auto;
}

#sidebar.open{
    transform:translateX(0);
}

.sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.close-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
}

.new-chat{
    width:100%;
    height:48px;
    border-radius:14px;
    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #8c4dff
        );
    font-weight:800;
    cursor:pointer;
    margin-bottom:16px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav button{
    width:100%;
    height:46px;
    padding:0 14px;
    border-radius:13px;
    background:transparent;
    text-align:right;
    cursor:pointer;
}

.nav button.active,
.nav button:active{
    background:rgba(255,255,255,.08);
}

.section-title{
    font-size:12px;
    opacity:.45;
    margin:
        22px 6px 9px;
}

.chat-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.chat-item{
    padding:11px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    overflow:hidden;
}

.chat-item-title{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item-project{
    margin-top:4px;
    font-size:10px;
    opacity:.45;
}


/* =====================================================
   OVERLAY
===================================================== */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);
    z-index:90;
    display:none;
}

#overlay.show{
    display:block;
}


/* =====================================================
   MAIN
===================================================== */

#main{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:62px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        0 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(8,9,14,.85);
    backdrop-filter:blur(20px);
}

.topbar-title{
    font-weight:800;
    font-size:16px;
}

.menu-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
    font-size:21px;
}

.status{
    font-size:11px;
    opacity:.55;
}


/* =====================================================
   WORKSPACE
===================================================== */

#workspace{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:16px;
    padding-bottom:170px;
}

.page{
    display:none;
    min-height:100%;
}

.page.active{
    display:block;
}


/* =====================================================
   HOME
===================================================== */

.home-empty{
    min-height:
        calc(100vh - 240px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    opacity:.9;
}

.home-icon{
    width:76px;
    height:76px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            rgba(112,92,255,.28),
            rgba(155,70,255,.18)
        );
    border:1px solid rgba(255,255,255,.1);
    font-size:30px;
    margin-bottom:18px;
}

.home-empty h1{
    margin:0;
    font-size:25px;
}

.home-empty p{
    margin-top:9px;
    opacity:.45;
    font-size:13px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.message{
    max-width:92%;
    padding:13px 15px;
    border-radius:17px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message.user{
    align-self:flex-start;
    background:
        linear-gradient(
            135deg,
            #5d4de9,
            #7846df
        );
    border-bottom-left-radius:5px;
}

.message.assistant{
    align-self:flex-end;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    border-bottom-right-radius:5px;
}


/* =====================================================
   ACTIVITY
===================================================== */

.activity-card{
    margin-top:14px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    background:rgba(255,255,255,.035);
    overflow:hidden;
}

.activity-head{
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
}

.activity-title{
    font-weight:800;
}

.activity-arrow{
    transition:.2s;
}

.activity-card.closed .activity-arrow{
    transform:rotate(180deg);
}

.activity-body{
    border-top:1px solid rgba(255,255,255,.06);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.activity-card.closed .activity-body{
    display:none;
}

.activity-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:12px;
}

.activity-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#7d6cff;
    margin-top:6px;
    flex:none;
}

.activity-text{
    opacity:.75;
}

.activity-tool{
    font-family:monospace;
    direction:ltr;
    text-align:left;
    opacity:.55;
}


/* =====================================================
   FILES
===================================================== */

.file-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.file-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.file{
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    direction:ltr;
    text-align:left;
}

.file:hover{
    background:rgba(255,255,255,.07);
}

.file-size{
    opacity:.4;
    font-size:10px;
    margin-top:3px;
}


/* =====================================================
   CODE VIEW
===================================================== */

.code-view{
    margin-top:14px;
    border-radius:16px;
    background:#05060a;
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
}

.code-head{
    padding:10px 13px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:12px;
    direction:ltr;
    text-align:left;
}

pre{
    margin:0;
    padding:15px;
    overflow:auto;
    direction:ltr;
    text-align:left;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
    font-size:12px;
    line-height:1.6;
}


/* =====================================================
   TERMINAL
===================================================== */

.terminal-box{
    border-radius:17px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:#030407;
}

.terminal-head{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    background:rgba(255,255,255,.04);
}

.terminal-title{
    font-family:monospace;
    font-size:12px;
}

.terminal-actions{
    display:flex;
    gap:6px;
}

.terminal-actions button{
    width:30px;
    height:30px;
    border-radius:8px;
    background:rgba(255,255,255,.07);
    cursor:pointer;
}

#terminalOutput{
    min-height:300px;
    max-height:65vh;
    overflow:auto;
    padding:15px;
    direction:ltr;
    text-align:left;
    font-family:monospace;
    font-size:12px;
    white-space:pre-wrap;
}


/* =====================================================
   COMPOSER
===================================================== */

#composer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    padding:
        10px 12px
        calc(10px + env(safe-area-inset-bottom));
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(7,8,13,.94) 28%
        );
}

.composer-inner{
    max-width:900px;
    margin:auto;
    padding:9px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    border-radius:20px;
    background:
        rgba(20,21,31,.94);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
        0 15px 50px rgba(0,0,0,.4);
    backdrop-filter:blur(22px);
}

#prompt{
    flex:1;
    min-height:44px;
    max-height:150px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:
        11px 8px;
    line-height:1.5;
}

#prompt::placeholder{
    color:rgba(255,255,255,.3);
}

.send-btn,
.stop-btn{
    width:45px;
    height:45px;
    border-radius:14px;
    cursor:pointer;
    flex:none;
}

.send-btn{
    background:
        linear-gradient(
            135deg,
            #6e5cff,
            #984fff
        );
}

.stop-btn{
    display:none;
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #b91c1c
        );
}

body.running .send-btn{
    display:none;
}

body.running .stop-btn{
    display:block;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(
    min-width:800px
){

    #workspace{
        padding-left:20%;
        padding-right:20%;
    }

    #composer{
        padding-left:20%;
        padding-right:20%;
    }
}

</style>

</head>

<body>

<div id="app">


<!-- ===================================================
     SIDEBAR
=================================================== -->

<aside id="sidebar">

    <div class="sidebar-top">

        <div class="logo">
            AI Agent
        </div>

        <button
            class="close-btn"
            id="closeSidebar"
        >
            ×
        </button>

    </div>


    <button
        class="new-chat"
        id="newChat"
    >
        ＋ New Chat
    </button>


    <div class="nav">

        <button
            data-page="home"
            class="active"
        >
            🏠 Home
        </button>

        <button
            data-page="chats"
        >
            💬 Chats
        </button>

        <button
            data-page="files"
        >
            📁 Files
        </button>

        <button
            data-page="activity"
        >
            ⚡ Agent Activity
        </button>

        <button
            data-page="terminal"
        >
            ⌘ Terminal
        </button>

    </div>


    <div class="section-title">
        Recent Chats
    </div>

    <div
        class="chat-list"
        id="chatList"
    ></div>

</aside>


<div
    id="overlay"
></div>


<!-- ===================================================
     MAIN
=================================================== -->

<main id="main">


<header class="topbar">

    <button
        class="menu-btn"
        id="menuBtn"
    >
        ☰
    </button>

    <div
        class="topbar-title"
        id="topTitle"
    >
        AI Agent
    </div>

    <div
        class="status"
        id="status"
    >
        Ready
    </div>

</header>


<div id="workspace">


<!-- HOME -->

<section
    class="page active"
    id="page-home"
>

    <div
        id="homeEmpty"
        class="home-empty"
    >

        <div class="home-icon">
            ✦
        </div>

        <h1>
            What can I build?
        </h1>

        <p>
            Your AI Agent is ready.
        </p>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <div
        id="activityContainer"
    ></div>

</section>


<!-- CHATS -->

<section
    class="page"
    id="page-chats"
>

    <h2>
        Chats
    </h2>

    <div
        class="chat-list"
        id="fullChatList"
    ></div>

</section>


<!-- FILES -->

<section
    class="page"
    id="page-files"
>

    <div class="file-toolbar">

        <strong>
            Project Files
        </strong>

        <button
            onclick="refreshFiles()"
        >
            ↻
        </button>

    </div>

    <div
        class="file-list"
        id="fileList"
    ></div>

    <div
        id="codeView"
    ></div>

</section>


<!-- ACTIVITY -->

<section
    class="page"
    id="page-activity"
>

    <h2>
        Agent Activity
    </h2>

    <div
        id="fullActivity"
    ></div>

</section>


<!-- TERMINAL -->

<section
    class="page"
    id="page-terminal"
>

    <div class="terminal-box">

        <div class="terminal-head">

            <div class="terminal-title">
                agent@project:~
            </div>

            <div class="terminal-actions">

                <button
                    id="clearTerminal"
                >
                    ×
                </button>

            </div>

        </div>

        <div
            id="terminalOutput"
        ></div>

    </div>

</section>


</div>


<!-- ===================================================
     COMPOSER
=================================================== -->

<div id="composer">

    <div class="composer-inner">

        <textarea
            id="prompt"
            placeholder="اشرح لي وش تبي أبني..."
            rows="1"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            ↑
        </button>

        <button
            class="stop-btn"
            id="stopBtn"
        >
            ■
        </button>

    </div>

</div>


</main>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://gemini-roblox-ai.onrender.com";


/* =====================================================
   STATE
===================================================== */

let currentChatId =
    localStorage.getItem(
        "currentChatId"
    );

let currentProject =
    localStorage.getItem(
        "currentProject"
    ) || "default";

let currentJobId =
    null;

let running =
    false;

let activityItems =
    [];


/* =====================================================
   ELEMENTS
===================================================== */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const closeSidebar =
    document.getElementById(
        "closeSidebar"
    );

const newChatBtn =
    document.getElementById(
        "newChat"
    );

const prompt =
    document.getElementById(
        "prompt"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const messages =
    document.getElementById(
        "messages"
    );

const homeEmpty =
    document.getElementById(
        "homeEmpty"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const topTitle =
    document.getElementById(
        "topTitle"
    );

const chatList =
    document.getElementById(
        "chatList"
    );

const fullChatList =
    document.getElementById(
        "fullChatList"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const codeView =
    document.getElementById(
        "codeView"
    );

const terminalOutput =
    document.getElementById(
        "terminalOutput"
    );

const activityContainer =
    document.getElementById(
        "activityContainer"
    );

const fullActivity =
    document.getElementById(
        "fullActivity"
    );


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

    sidebar.classList.add(
        "open"
    );

    overlay.classList.add(
        "show"
    );

    loadChats();
}


function closeSidebarMenu(){

    sidebar.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );
}


menuBtn.onclick =
    openSidebar;

closeSidebar.onclick =
    closeSidebarMenu;

overlay.onclick =
    closeSidebarMenu;


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(
    page
){

    document
        .querySelectorAll(".page")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    const target =
        document.getElementById(
            `page-${page}`
        );

    if(target){

        target.classList.add(
            "active"
        );
    }


    document
        .querySelectorAll(".nav button")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page === page
                );

            }
        );


    /*
     * مهم:
     * مربع الكتابة لا يختفي أثناء تشغيل الـAgent.
     * وفي الصفحات الأخرى نخليه ظاهر فقط في Home.
     */

    const composer =
        document.getElementById(
            "composer"
        );

    if(
        page === "home" ||
        running
    ){

        composer.style.display =
            "block";

    }else{

        composer.style.display =
            "none";
    }


    closeSidebarMenu();


    if(page === "files"){

        refreshFiles();
    }


    if(page === "chats"){

        loadChats();
    }


    if(page === "activity"){

        renderFullActivity();
    }


    if(page === "terminal"){

        terminalOutput.scrollTop =
            terminalOutput.scrollHeight;
    }
}


document
    .querySelectorAll(".nav button")
    .forEach(
        button => {

            button.onclick =
                () =>
                    showPage(
                        button.dataset.page
                    );

        }
    );


/* =====================================================
   CHAT ID
===================================================== */

function makeChatId(){

    return "chat_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8);
}


/* =====================================================
   NEW CHAT
===================================================== */

async function newChat(){

    stopCurrentAgent();

    const id =
        makeChatId();

    const title =
        "New Chat";

    const project =
        "project_" +
        Date.now();

    try {

        const response =
            await fetch(
                `${API_URL}/chats/new`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        id,
                        title,
                        project
                    })
                }
            );

        const data =
            await response.json();

        if(!data.ok){

            throw new Error(
                data.error ||
                "Failed to create chat"
            );
        }

        currentChatId =
            data.chat.id;

        currentProject =
            data.chat.project;

    } catch(error){

        /*
         * حتى لو السيرفر غير متاح،
         * نقدر نجهز Chat ID محلي.
         */

        currentChatId =
            id;

        currentProject =
            project;
    }


    localStorage.setItem(
        "currentChatId",
        currentChatId
    );

    localStorage.setItem(
        "currentProject",
        currentProject
    );


    messages.innerHTML =
        "";

    activityContainer.innerHTML =
        "";

    fullActivity.innerHTML =
        "";

    activityItems =
        [];

    codeView.innerHTML =
        "";

    terminalOutput.textContent =
        "";


    homeEmpty.style.display =
        "flex";

    topTitle.textContent =
        "New Chat";

    statusEl.textContent =
        "Ready";


    document.body.classList.remove(
        "running"
    );

    running =
        false;


    showPage(
        "home"
    );

    loadChats();
}


newChatBtn.onclick =
    newChat;


/* =====================================================
   LOAD CHATS
===================================================== */

async function loadChats(){

    try {

        const response =
            await fetch(
                `${API_URL}/chats`
            );

        const data =
            await response.json();

        if(!data.ok){

            return;
        }

        renderChatList(
            chatList,
            data.chats
        );

        renderChatList(
            fullChatList,
            data.chats
        );

    } catch {}
}


function renderChatList(
    element,
    chats
){

    element.innerHTML =
        "";

    if(!chats.length){

        element.innerHTML =
            `<div style="opacity:.4;font-size:12px;padding:10px">
                No chats yet
             </div>`;

        return;
    }


    chats.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chat-item";

            item.innerHTML = `

                <div class="chat-item-title">
                    ${escapeHTML(
                        chat.title ||
                        "Untitled"
                    )}
                </div>

                <div class="chat-item-project">
                    ${escapeHTML(
                        chat.project ||
                        "default"
                    )}
                </div>
            `;


            item.onclick =
                () =>
                    openChat(
                        chat.id
                    );


            element.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(
    chatId
){

    try {

        const response =
            await fetch(
                `${API_URL}/chat?id=${encodeURIComponent(
                    chatId
                )}`
            );

        const data =
            await response.json();

        if(!data.ok){

            throw new Error(
                data.error ||
                "Chat unavailable"
            );
        }

        const chat =
            data.chat;

        currentChatId =
            chat.id;

        currentProject =
            chat.project;

        localStorage.setItem(
            "currentChatId",
            currentChatId
        );

        localStorage.setItem(
            "currentProject",
            currentProject
        );


        messages.innerHTML =
            "";

        activityContainer.innerHTML =
            "";

        activityItems =
            [];

        topTitle.textContent =
            chat.title ||
            "Chat";


        const visibleMessages =
            chat.messages || [];


        if(
            visibleMessages.length
        ){

            homeEmpty.style.display =
                "none";
        }else{

            homeEmpty.style.display =
                "flex";
        }


        visibleMessages.forEach(
            message => {

                if(
                    message.role === "user"
                ){

                    addMessage(
                        "user",
                        message.content
                    );

                }else if(
                    message.role === "assistant"
                ){

                    addMessage(
                        "assistant",
                        message.content
                    );
                }

            }
        );


        showPage(
            "home"
        );

        closeSidebarMenu();

    } catch(error){

        alert(
            "تعذر فتح الدردشة: " +
            error.message
        );
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function addMessage(
    role,
    text
){

    homeEmpty.style.display =
        "none";

    const element =
        document.createElement(
            "div"
        );

    element.className =
        `message ${role}`;

    element.textContent =
        text;

    messages.appendChild(
        element
    );

    document
        .getElementById(
            "workspace"
        )
        .scrollTop =
        document
            .getElementById(
                "workspace"
            )
            .scrollHeight;

    return element;
}


/* =====================================================
   ACTIVITY
===================================================== */

function addActivity(
    text,
    tool = ""
){

    const item = {
        text,
        tool,
        time: new Date()
    };

    activityItems.push(
        item
    );

    renderActivity(
        activityContainer
    );

    renderFullActivity();


    const page =
        document.getElementById(
            "page-activity"
        );

    if(page){

        /*
         * nothing
         */
    }
}


function renderActivity(
    target
){

    if(!activityItems.length){

        target.innerHTML =
            "";

        return;
    }


    target.innerHTML = `

        <div class="activity-card">

            <div
                class="activity-head"
                onclick="this.parentElement.classList.toggle('closed')"
            >

                <div class="activity-title">
                    ⚡ Agent Activity
                </div>

                <div class="activity-arrow">
                    ▲
                </div>

            </div>

            <div class="activity-body">

                ${
                    activityItems
                        .map(
                            item => `

                            <div class="activity-row">

                                <div class="activity-dot"></div>

                                <div>

                                    <div class="activity-text">
                                        ${escapeHTML(
                                            item.text
                                        )}
                                    </div>

                                    ${
                                        item.tool
                                        ?
                                        `<div class="activity-tool">
                                            ${escapeHTML(
                                                item.tool
                                            )}
                                        </div>`
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        `
                        )
                        .join("")
                }

            </div>

        </div>
    `;
}


function renderFullActivity(){

    renderActivity(
        fullActivity
    );
}


/* =====================================================
   TERMINAL
===================================================== */

function terminalLog(
    text
){

    terminalOutput.textContent +=
        `${text}\n`;

    terminalOutput.scrollTop =
        terminalOutput.scrollHeight;
}


document
    .getElementById(
        "clearTerminal"
    )
    .onclick =
    () => {

        terminalOutput.textContent =
            "";
    };


/* =====================================================
   SEND
===================================================== */

async function sendPrompt(){

    const text =
        prompt.value.trim();

    if(!text){

        return;
    }

    if(running){

        return;
    }


    if(!currentChatId){

        await newChat();
    }


    prompt.value =
        "";

    autoResize();


    addMessage(
        "user",
        text
    );


    activityItems =
        [];

    activityContainer.innerHTML =
        "";


    running =
        true;

    document.body.classList.add(
        "running"
    );


    statusEl.textContent =
        "Agent running";


    showPage(
        "home"
    );


    try {

        const response =
            await fetch(
                `${API_URL}/agent`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        chatId:
                            currentChatId,
                        project:
                            currentProject,
                        prompt:
                            text
                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                errorText ||
                `HTTP ${response.status}`
            );
        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();

        let buffer =
            "";


        while(true){

            if(!running){

                break;
            }

            const {
                value,
                done
            } =
                await reader.read();


            if(done){

                break;
            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");

            buffer =
                lines.pop() ||
                "";


            for(
                const line of lines
            ){

                if(!line.trim()){

                    continue;
                }


                let event;

                try {

                    event =
                        JSON.parse(
                            line
                        );

                } catch {

                    continue;
                }


                handleAgentEvent(
                    event
                );
            }
        }

    } catch(error){

        if(running){

            addActivity(
                "حدث خطأ أثناء الاتصال بالـAgent"
            );

            addMessage(
                "assistant",
                error.message
            );

        }

    } finally {

        running =
            false;

        document.body.classList.remove(
            "running"
        );

        statusEl.textContent =
            "Ready";

        showPage(
            "home"
        );

        loadChats();
    }
}


/* =====================================================
   HANDLE EVENTS
===================================================== */

function handleAgentEvent(
    event
){

    switch(
        event.type
    ){

        case "connected":

            currentJobId =
                event.jobId;

            addActivity(
                "Agent connected"
            );

            break;


        case "start":

            addActivity(
                `Project: ${
                    event.project
                }`
            );

            break;


        case "thinking":

            addActivity(
                `Planning next step — Step ${event.step}`
            );

            break;


        case "planning":

            addActivity(
                event.message ||
                "Planning next step"
            );

            break;


        case "tool_start":

            addActivity(
                event.message ||
                `Running ${event.tool}`,
                event.tool
            );

            break;


        case "tool_result":

            addActivity(
                `Completed: ${event.tool}`,
                event.tool
            );

            if(
                event.tool === "terminal" &&
                event.result
            ){

                if(
                    event.result.stdout
                ){

                    terminalLog(
                        event.result.stdout
                    );
                }

                if(
                    event.result.stderr
                ){

                    terminalLog(
                        event.result.stderr
                    );
                }
            }

            break;


        case "tool_error":

            addActivity(
                `Error: ${event.error}`,
                event.tool
            );

            terminalLog(
                `[ERROR] ${
                    event.error
                }`
            );

            break;


        case "final":

            if(event.message){

                addMessage(
                    "assistant",
                    event.message
                );
            }

            addActivity(
                "Agent finished"
            );

            break;


        case "stopped":

            addActivity(
                "Agent stopped by user"
            );

            addMessage(
                "assistant",
                "تم إيقاف المهمة."
            );

            break;


        case "error":

            addActivity(
                `Error: ${event.message}`
            );

            addMessage(
                "assistant",
                event.message ||
                "حدث خطأ."
            );

            break;


        case "done":

            statusEl.textContent =
                "Completed";

            break;
    }
}


/* =====================================================
   STOP
===================================================== */

async function stopCurrentAgent(){

    if(!currentJobId){

        return;
    }

    try {

        await fetch(
            `${API_URL}/agent/stop`,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    jobId:
                        currentJobId
                })
            }
        );

    } catch {}


    running =
        false;

    document.body.classList.remove(
        "running"
    );

    statusEl.textContent =
        "Stopped";


    addActivity(
        "تم طلب إيقاف الـAgent"
    );

    currentJobId =
        null;
}


stopBtn.onclick =
    stopCurrentAgent;


/* =====================================================
   SEND BUTTON
===================================================== */

sendBtn.onclick =
    sendPrompt;


prompt.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendPrompt();
        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

function autoResize(){

    prompt.style.height =
        "auto";

    prompt.style.height =
        Math.min(
            prompt.scrollHeight,
            150
        ) + "px";
}


prompt.addEventListener(
    "input",
    autoResize
);


/* =====================================================
   FILES
===================================================== */

async function refreshFiles(){

    try {

        const response =
            await fetch(
                `${API_URL}/files?project=${encodeURIComponent(
                    currentProject
                )}`
            );

        const data =
            await response.json();

        if(!data.ok){

            throw new Error(
                data.error
            );
        }


        fileList.innerHTML =
            "";


        if(!data.files.length){

            fileList.innerHTML =
                `<div style="opacity:.4">
                    No files yet.
                 </div>`;

            return;
        }


        data.files.forEach(
            file => {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "file";

                element.innerHTML = `

                    <div>
                        ${
                            file.type === "folder"
                            ? "📁 "
                            : "📄 "
                        }

                        ${escapeHTML(
                            file.path
                        )}
                    </div>

                    ${
                        file.size !== undefined
                        ?
                        `<div class="file-size">
                            ${file.size} bytes
                         </div>`
                        :
                        ""
                    }

                `;


                if(
                    file.type === "file"
                ){

                    element.onclick =
                        () =>
                            openFile(
                                file.path
                            );
                }


                fileList.appendChild(
                    element
                );
            }
        );

    } catch(error){

        fileList.innerHTML =
            `<div style="opacity:.5">
                ${escapeHTML(
                    error.message
                )}
             </div>`;
    }
}


/* =====================================================
   OPEN FILE
===================================================== */

async function openFile(
    filePath
){

    try {

        const response =
            await fetch(
                `${API_URL}/file?project=${encodeURIComponent(
                    currentProject
                )}&path=${encodeURIComponent(
                    filePath
                )}`
            );

        const data =
            await response.json();

        if(!data.ok){

            throw new Error(
                data.error
            );
        }


        codeView.innerHTML = `

            <div class="code-view">

                <div class="code-head">
                    ${escapeHTML(
                        filePath
                    )}
                </div>

                <pre>${escapeHTML(
                    data.content
                )}</pre>

            </div>

        `;

    } catch(error){

        alert(
            error.message
        );
    }
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}
