<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Gemini AI Agent</title>

<style>
:root{
    --bg:#07070b;
    --panel:#101017;
    --panel2:#15151e;
    --line:#282834;
    --text:#f5f5f7;
    --muted:#9696a8;
    --purple:#8b5cf6;
    --blue:#3b82f6;
    --green:#35d07f;
    --red:#ff5d73;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    color:inherit;
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    position:relative;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:30;
}

.overlay.open{
    display:block;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    z-index:40;
    top:0;
    right:0;
    width:290px;
    height:100%;
    padding:18px;
    background:rgba(12,12,18,.98);
    border-left:1px solid var(--line);
    transform:translateX(105%);
    transition:.22s ease;
    overflow-y:auto;
}

.sidebar.open{
    transform:translateX(0);
}

.brand{
    font-size:18px;
    font-weight:800;
    margin:4px 4px 22px;
}

.brand small{
    display:block;
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
    font-weight:500;
}

.closeMenu{
    position:absolute;
    left:14px;
    top:14px;
    width:38px;
    height:38px;
    border-radius:11px;
    background:#1a1a23;
    border:1px solid var(--line);
    font-size:23px;
}

.nav{
    display:grid;
    gap:8px;
}

.nav button{
    width:100%;
    padding:13px;
    border-radius:12px;
    background:#12121a;
    border:1px solid var(--line);
    text-align:right;
}

.nav button.active{
    background:#1a1629;
    border-color:#7654e2;
}

.backendStatus{
    margin-top:18px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:12px;
}

.backendStatus b{
    color:var(--green);
}

/* MAIN */

.main{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid var(--line);
    background:rgba(7,7,11,.88);
    backdrop-filter:blur(15px);
}

.menuButton{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#12121a;
    border:1px solid var(--line);
    font-size:22px;
}

.pageTitle{
    font-weight:800;
}

.connectionDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.connectionDot.online{
    background:var(--green);
    box-shadow:0 0 14px var(--green);
}

/* VIEWS */

.view{
    display:none;
    flex:1;
    min-height:0;
    overflow:auto;
    padding:18px;
}

.view.active{
    display:block;
}

.home{
    padding:0;
    overflow:hidden;
    flex-direction:column;
}

.home.active{
    display:flex;
}

.hero{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
}

.hero h1{
    margin:0 0 8px;
    font-size:28px;
}

.hero p{
    margin:0;
    max-width:420px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
}

/* COMPOSER */

.composer{
    flex:none;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:rgba(7,7,11,.94);
}

.composeBox{
    display:flex;
    gap:8px;
    align-items:flex-end;
    background:#101017;
    border:1px solid var(--line);
    border-radius:17px;
    padding:8px;
}

.prompt{
    flex:1;
    min-height:42px;
    max-height:130px;
    resize:none;
    outline:none;
    border:0;
    background:transparent;
    color:var(--text);
    padding:10px;
}

.prompt::placeholder{
    color:#777788;
}

.sendButton{
    width:46px;
    height:46px;
    flex:none;
    border-radius:13px;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    font-weight:900;
    font-size:20px;
}

.sendButton:disabled{
    opacity:.4;
}

/* CARDS */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:12px;
}

.button{
    padding:9px 12px;
    border-radius:10px;
    background:#171720;
    border:1px solid var(--line);
}

.button.primary{
    background:#6d4bd7;
    border-color:#8062e8;
}

.button.danger{
    color:#ff8797;
    border-color:#592630;
}

.input{
    width:100%;
    padding:11px;
    border-radius:11px;
    outline:none;
    background:#0b0b11;
    border:1px solid var(--line);
    color:var(--text);
}

.input:focus{
    border-color:#7051d8;
}

/* ACTIVITY */

.activity{
    display:grid;
    gap:8px;
}

.event{
    background:#0e0e15;
    border:1px solid var(--line);
    border-radius:11px;
    padding:10px;
}

.eventTitle{
    color:#a995ff;
    font-size:11px;
    font-weight:700;
}

.eventText{
    margin-top:6px;
    color:#d7d7df;
    font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;
    word-break:break-word;
}

/* TERMINAL */

.terminal{
    min-height:55vh;
    background:#050507;
    border:1px solid #24242c;
    border-radius:14px;
    padding:12px;
    color:#dedee6;
    font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
}

/* FILES */

.file{
    background:#0e0e15;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px;
    margin-bottom:8px;
    word-break:break-word;
}

/* KEYS */

.key{
    display:grid;
    gap:10px;
}

.keyInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.pill{
    padding:4px 8px;
    border-radius:999px;
    background:#171722;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:10px;
}

.pill.active{
    color:#7ee9aa;
    border-color:#24583b;
}

.empty{
    padding:35px 10px;
    color:var(--muted);
    text-align:center;
}
</style>
</head>

<body>

<div class="app">

    <div id="overlay" class="overlay"></div>

    <!-- MENU -->
    <aside id="sidebar" class="sidebar">

        <button id="closeMenu" class="closeMenu" type="button">
            ×
        </button>

        <div class="brand">
            Gemini AI Agent
            <small>General-purpose AI workspace</small>
        </div>

        <div class="nav">

            <button type="button" data-page="home">
                ⌂ Home
            </button>

            <button type="button" data-page="chats">
                ◌ Chats
            </button>

            <button type="button" data-page="files">
                ▣ Files
            </button>

            <button type="button" data-page="activity">
                ◈ Agent Activity
            </button>

            <button type="button" data-page="terminal">
                ⌘ Terminal
            </button>

            <button type="button" data-page="keys">
                ⚿ Gemini API Keys
            </button>

        </div>

        <div class="backendStatus">
            Backend:
            <b id="backendText">Checking...</b>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <button id="menuButton" class="menuButton" type="button">
                ☰
            </button>

            <div id="pageTitle" class="pageTitle">
                Home
            </div>

            <span id="connectionDot" class="connectionDot"></span>

        </header>

        <!-- HOME -->
        <section id="home" class="view home active">

            <div class="hero">

                <h1>Gemini AI Agent</h1>

                <p>
                    Tell the Agent what you want it to build, edit, run, test, or fix.
                </p>

            </div>

            <div id="composer" class="composer">

                <div class="composeBox">

                    <textarea
                        id="prompt"
                        class="prompt"
                        rows="1"
                        placeholder="اكتب طلبك للـ Agent..."
                    ></textarea>

                    <button
                        id="sendButton"
                        class="sendButton"
                        type="button"
                    >
                        ↑
                    </button>

                </div>

            </div>

        </section>

        <!-- CHATS -->
        <section id="chats" class="view">

            <div class="container">

                <div class="card">

                    <div class="row">

                        <b>Chats</b>

                        <button
                            id="newChat"
                            class="button primary"
                            type="button"
                        >
                            New chat
                        </button>

                    </div>

                </div>

                <div id="chatList"></div>

            </div>

        </section>

        <!-- FILES -->
        <section id="files" class="view">

            <div class="container">

                <div class="card">

                    <div class="row">

                        <b>Files</b>

                        <button
                            id="refreshFiles"
                            class="button"
                            type="button"
                        >
                            Refresh
                        </button>

                    </div>

                </div>

                <div id="fileList"></div>

            </div>

        </section>

        <!-- ACTIVITY -->
        <section id="activity" class="view">

            <div class="container">

                <div class="card">

                    <div class="row">

                        <b>Agent Activity</b>

                        <button
                            id="clearActivity"
                            class="button"
                            type="button"
                        >
                            Clear
                        </button>

                    </div>

                </div>

                <div id="activityList" class="activity"></div>

            </div>

        </section>

        <!-- TERMINAL -->
        <section id="terminal" class="view">

            <div class="container">

                <div class="card">

                    <div class="row">

                        <b>Terminal</b>

                        <button
                            id="clearTerminal"
                            class="button"
                            type="button"
                        >
                            Clear
                        </button>

                    </div>

                </div>

                <div id="terminalOutput" class="terminal"></div>

            </div>

        </section>

        <!-- KEYS -->
        <section id="keys" class="view">

            <div class="container">

                <div class="card key">

                    <b>Gemini API Keys</b>

                    <div class="small muted">
                        Keys are handled by the backend. Only masked keys are displayed here.
                    </div>

                    <input
                        id="keyName"
                        class="input"
                        type="text"
                        placeholder="Key name"
                    >

                    <input
                        id="keyValue"
                        class="input"
                        type="password"
                        placeholder="Gemini API key"
                    >

                    <button
                        id="addKey"
                        class="button primary"
                        type="button"
                    >
                        Add key
                    </button>

                </div>

                <div id="keyList"></div>

            </div>

        </section>

    </main>

</div>

<script>
(function(){

"use strict";

/* =========================================================
   IMPORTANT
   ========================================================= */

const API = "https://gemini-roblox-ai.onrender.com";

const PROJECT = "default";

/* =========================================================
   STATE
   ========================================================= */

const state = {

    page: "home",

    busy: false,

    events: [],

    terminal: "",

    processedLength: 0,

    agentXHR: null

};

/* =========================================================
   ELEMENT HELPER
   ========================================================= */

function $(id){
    return document.getElementById(id);
}

/* =========================================================
   PAGES
   ========================================================= */

const pages = [
    "home",
    "chats",
    "files",
    "activity",
    "terminal",
    "keys"
];

const pageNames = {

    home: "Home",

    chats: "Chats",

    files: "Files",

    activity: "Agent Activity",

    terminal: "Terminal",

    keys: "Gemini API Keys"

};

/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

}

/* =========================================================
   API URL
   ========================================================= */

function apiURL(path){

    return API.replace(/\/+$/,"") + path;

}

/* =========================================================
   STATUS
   ========================================================= */

function setBackendStatus(online){

    $("connectionDot").className =
        online
        ? "connectionDot online"
        : "connectionDot";

    $("backendText").textContent =
        online
        ? "Online"
        : "Offline";

}

/* =========================================================
   MENU
   ========================================================= */

function openMenu(){

    $("sidebar").classList.add("open");

    $("overlay").classList.add("open");

}

function closeMenu(){

    $("sidebar").classList.remove("open");

    $("overlay").classList.remove("open");

}

/* =========================================================
   PAGE
   ========================================================= */

function showPage(page){

    if(!pages.includes(page)){
        page = "home";
    }

    state.page = page;

    for(const name of pages){

        const el = $(name);

        if(el){
            el.classList.toggle(
                "active",
                name === page
            );
        }

    }

    $("pageTitle").textContent =
        pageNames[page];

    document
        .querySelectorAll("[data-page]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });

    $("composer").style.display =
        page === "home"
        ? "block"
        : "none";

    closeMenu();

    if(page === "files"){
        loadFiles();
    }

    if(page === "chats"){
        loadChats();
    }

    if(page === "keys"){
        loadKeys();
    }

}

/* =========================================================
   NORMAL XHR
   ========================================================= */

function request(
    method,
    path,
    body,
    success,
    failure
){

    const xhr = new XMLHttpRequest();

    try{

        xhr.open(
            method,
            apiURL(path),
            true
        );

    }catch(error){

        if(failure){
            failure(
                error.message || String(error)
            );
        }

        return xhr;

    }

    xhr.setRequestHeader(
        "Accept",
        "application/json,text/plain"
    );

    if(body !== undefined){

        xhr.setRequestHeader(
            "Content-Type",
            "application/json;charset=UTF-8"
        );

    }

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }

        let data = null;

        try{

            data =
                xhr.responseText
                ? JSON.parse(xhr.responseText)
                : null;

        }catch(error){

            data = xhr.responseText;

        }

        if(
            xhr.status >= 200 &&
            xhr.status < 300
        ){

            if(success){
                success(data,xhr);
            }

        }else{

            let message =
                "HTTP " + xhr.status;

            if(
                data &&
                typeof data === "object"
            ){

                message =
                    data.message ||
                    data.error ||
                    message;

            }

            if(failure){
                failure(message,xhr);
            }

        }

    };

    xhr.onerror = function(){

        if(failure){
            failure("Network/CORS error",xhr);
        }

    };

    xhr.ontimeout = function(){

        if(failure){
            failure("Request timed out",xhr);
        }

    };

    try{

        xhr.send(
            body === undefined
            ? null
            : JSON.stringify(body)
        );

    }catch(error){

        if(failure){
            failure(
                error.message || String(error),
                xhr
            );
        }

    }

    return xhr;

}

/* =========================================================
   ACTIVITY
   ========================================================= */

function addActivity(
    title,
    text
){

    state.events.push({

        title: title,

        text:
            text == null
            ? ""
            : String(text)

    });

    renderActivity();

}

function renderActivity(){

    const box = $("activityList");

    if(!state.events.length){

        box.innerHTML =
            '<div class="empty">No agent activity yet.</div>';

        return;

    }

    box.innerHTML =
        state.events
        .map(event => {

            return `
                <div class="event">

                    <div class="eventTitle">
                        ${escapeHTML(event.title)}
                    </div>

                    <div class="eventText">
                        ${escapeHTML(event.text)}
                    </div>

                </div>
            `;

        })
        .join("");

    box.scrollTop =
        box.scrollHeight;

}

/* =========================================================
   TERMINAL
   ========================================================= */

function addTerminal(text){

    if(
        text === null ||
        text === undefined ||
        text === ""
    ){
        return;
    }

    state.terminal +=
        (state.terminal ? "\n" : "") +
        String(text);

    $("terminalOutput").textContent =
        state.terminal;

    $("terminalOutput").scrollTop =
        $("terminalOutput").scrollHeight;

}

/* =========================================================
   AGENT EVENTS
   ========================================================= */

function handleAgentEvent(event){

    if(!event){
        return;
    }

    const type =
        event.type || "message";

    const message =
        event.message ??
        event.error ??
        event.step ??
        event.result ??
        "";

    switch(type){

        case "connected":

            addActivity(
                "Connected",
                "Project: " +
                (event.project || PROJECT)
            );

            break;


        case "start":

            addActivity(
                "Agent started",
                event.keyName
                ? "Key: " + event.keyName
                : ""
            );

            break;


        case "thinking":

            addActivity(
                "Thinking",
                message
            );

            break;


        case "planning":

            addActivity(
                "Planning",
                message
            );

            break;


        case "tool_start":

            addActivity(
                "Tool start",
                String(
                    event.tool || "tool"
                ) +
                (
                    message
                    ? " — " + message
                    : ""
                )
            );

            addTerminal(
                "> " +
                String(
                    event.tool || "tool"
                ) +
                (
                    message
                    ? " — " + message
                    : ""
                )
            );

            break;


        case "tool_result":

            let resultText;

            if(
                typeof message === "string"
            ){

                resultText = message;

            }else{

                try{

                    resultText =
                        JSON.stringify(
                            message,
                            null,
                            2
                        );

                }catch(error){

                    resultText =
                        String(message);

                }

            }

            addActivity(
                "Tool result",
                resultText
            );

            addTerminal(resultText);

            break;


        case "tool_error":

            addActivity(
                "Tool error",
                String(
                    event.tool || "tool"
                ) +
                (
                    message
                    ? " — " + message
                    : ""
                )
            );

            addTerminal(
                "ERROR: " +
                String(message || event.tool || "tool")
            );

            break;


        case "final":

            addActivity(
                "Final",
                message
            );

            break;


        case "error":

            addActivity(
                "Error",
                message || "Unknown agent error"
            );

            break;


        case "done":

            addActivity(
                "Done",
                "Agent finished."
            );

            break;


        default:

            addActivity(
                type,
                message ||
                JSON.stringify(event)
            );

            break;

    }

}

/* =========================================================
   NDJSON STREAM PARSER
   ========================================================= */

function processAgentStream(
    raw,
    final
){

    if(!raw){
        return;
    }

    let newText =
        raw.substring(
            state.processedLength
        );

    state.processedLength =
        raw.length;

    const lines =
        newText.split(/\r?\n/);

    if(!final){

        /*
         Keep the last incomplete line.
         */

        const last =
            lines.pop();

        if(
            last &&
            last.trim()
        ){

            /*
             Put incomplete line back
             by moving processed pointer.
             */

            state.processedLength -=
                last.length;

        }

    }

    for(const line of lines){

        const clean =
            line.trim();

        if(!clean){
            continue;
        }

        try{

            const event =
                JSON.parse(clean);

            handleAgentEvent(event);

        }catch(error){

            addActivity(
                "Stream parse error",
                clean
            );

        }

    }

    if(final){

        /*
         Parse anything remaining
         after the final newline.
         */

        const remaining =
            raw.substring(
                state.processedLength
            ).trim();

        if(remaining){

            try{

                handleAgentEvent(
                    JSON.parse(remaining)
                );

                state.processedLength =
                    raw.length;

            }catch(error){

                addActivity(
                    "Stream parse error",
                    remaining
                );

            }

        }

    }

}

/* =========================================================
   RUN AGENT
   ========================================================= */

function runAgent(){

    if(state.busy){
        return;
    }

    const message =
        $("prompt").value.trim();

    if(!message){
        return;
    }

    state.busy = true;

    $("sendButton").disabled = true;

    state.events = [];

    state.terminal = "";

    state.processedLength = 0;

    renderActivity();

    $("terminalOutput").textContent = "";

    addActivity(
        "Request",
        message
    );

    showPage("activity");

    const xhr =
        new XMLHttpRequest();

    state.agentXHR = xhr;

    try{

        /*
         IMPORTANT:
         This is POST /agent.
         The browser never opens /agent directly.
         */

        xhr.open(
            "POST",
            apiURL("/agent"),
            true
        );

    }catch(error){

        finishAgent();

        addActivity(
            "Error",
            error.message || String(error)
        );

        return;

    }

    xhr.setRequestHeader(
        "Content-Type",
        "application/json;charset=UTF-8"
    );

    xhr.setRequestHeader(
        "Accept",
        "application/x-ndjson,application/json,text/plain"
    );

    xhr.onprogress = function(){

        processAgentStream(
            xhr.responseText || "",
            false
        );

    };

    xhr.onreadystatechange = function(){

        if(xhr.readyState !== 4){
            return;
        }

        /*
         Process the final stream.
         */

        processAgentStream(
            xhr.responseText || "",
            true
        );

        if(
            xhr.status >= 200 &&
            xhr.status < 300
        ){

            setBackendStatus(true);

        }else{

            let message =
                "HTTP " + xhr.status;

            try{

                const data =
                    JSON.parse(
                        xhr.responseText
                    );

                message =
                    data.message ||
                    data.error ||
                    message;

            }catch(error){}

            addActivity(
                "HTTP error",
                message
            );

        }

        finishAgent();

    };

    xhr.onerror = function(){

        addActivity(
            "Error",
            "Network/CORS error."
        );

        setBackendStatus(false);

        finishAgent();

    };

    xhr.ontimeout = function(){

        addActivity(
            "Error",
            "Request timed out."
        );

        finishAgent();

    };

    const payload = {

        message: message,

        project: PROJECT

    };

    try{

        xhr.send(
            JSON.stringify(payload)
        );

    }catch(error){

        addActivity(
            "Error",
            error.message || String(error)
        );

        finishAgent();

    }

    $("prompt").value = "";

    $("prompt").style.height =
        "auto";

}

/* =========================================================
   FINISH AGENT
   ========================================================= */

function finishAgent(){

    state.busy = false;

    $("sendButton").disabled = false;

    state.agentXHR = null;

}

/* =========================================================
   HEALTH
   ========================================================= */

function loadHealth(){

    request(
        "GET",
        "/health",
        undefined,

        function(data){

            if(
                data &&
                data.ok
            ){

                setBackendStatus(true);

            }else{

                setBackendStatus(false);

            }

        },

        function(){

            setBackendStatus(false);

        }
    );

}

/* =========================================================
   FILES
   ========================================================= */

function loadFiles(){

    const box =
        $("fileList");

    box.innerHTML =
        '<div class="empty">Loading...</div>';

    request(
        "GET",
        "/files",
        undefined,

        function(data){

            let files = [];

            if(
                Array.isArray(data)
            ){

                files = data;

            }else if(
                data &&
                Array.isArray(data.files)
            ){

                files = data.files;

            }

            if(!files.length){

                box.innerHTML =
                    '<div class="empty">No files yet.</div>';

                return;

            }

            box.innerHTML =
                files
                .map(file => {

                    const name =
                        typeof file === "string"
                        ? file
                        : (
                            file.path ||
                            file.name ||
                            JSON.stringify(file)
                        );

                    return `
                        <div class="file">
                            ${escapeHTML(name)}
                        </div>
                    `;

                })
                .join("");

        },

        function(error){

            box.innerHTML =
                '<div class="empty">' +
                escapeHTML(error) +
                '</div>';

        }
    );

}

/* =========================================================
   CHATS
   ========================================================= */

function loadChats(){

    const box =
        $("chatList");

    box.innerHTML =
        '<div class="empty">Loading...</div>';

    request(
        "GET",
        "/chats",
        undefined,

        function(data){

            let chats = [];

            if(
                Array.isArray(data)
            ){

                chats = data;

            }else if(
                data &&
                Array.isArray(data.chats)
            ){

                chats = data.chats;

            }

                '</div>';

        }
    );

}

/* =========================================================
   KEYS
   ========================================================= */

function loadKeys(){

    const box =
        $("keyList");

    box.innerHTML =
        '<div class="empty">Loading...</div>';

    request(
        "GET",
        "/keys",
        undefined,

        function(data){

            const keys = [];

            if(
                data &&
                data.primary
            ){

                keys.push(
                    data.primary
                );

            }

            if(
                data &&
                Array.isArray(data.keys)
            ){

                for(
                    const key of data.keys
                ){

                    if(!key.primary){
                        keys.push(key);
                    }

                }

            }

            if(!keys.length){

                box.innerHTML =
                    '<div class="empty">No keys returned.</div>';

                return;

            }

            box.innerHTML =
                keys
                .map(key => {

                    const active =
                        key.active ||
                        (
                            data &&
                            data.activeKeyId === key.id
                        );

                    const primary =
                        !!key.primary;

                    const masked =
                        key.maskedKey ||
                        key.masked ||
                        "••••••••";

                    const status =
                        active
                        ? "Active"
                        : (
                            key.enabled === false
                            ? "Disabled"
                            : "Ready"
                        );

                    return `
                        <div class="card key">

                            <div class="keyInfo">

                                <div>

                                    <b>
                                        ${escapeHTML(
                                            key.name || "Key"
                                        )}
                                    </b>

                                    <div class="small muted">
                                        ${escapeHTML(
                                            key.provider ||
                                            "Google Gemini"
                                        )}
                                        ·
                                        ${escapeHTML(masked)}
                                    </div>

                                </div>

                                <span class="pill ${active ? "active" : ""}">
                                    ${status}
                                </span>

                            </div>

                            <div class="row">

                                <button
                                    class="button useKey"
                                    data-id="${escapeHTML(key.id)}"
                                    type="button"
                                >
                                    Use
                                </button>

                                ${
                                    primary
                                    ? ""
                                    : `
                                        <button
                                            class="button stopKey"
                                            data-id="${escapeHTML(key.id)}"
                                            type="button"
                                        >
                                            ${
                                                key.enabled === false
                                                ? "Enable"
                                                : "Stop"
                                            }
                                        </button>
                                    `
                                }

                                ${
                                    primary
                                    ? ""
                                    : `
                                        <button
                                            class="button danger deleteKey"
                                            data-id="${escapeHTML(key.id)}"
                                            type="button"
                                        >
                                            Delete
                                        </button>
                                    `
                                }

                            </div>

                        </div>
                    `;

                })
                .join("");

        },

        function(error){

            box.innerHTML =
                '<div class="empty">' +
                escapeHTML(error) +
                '</div>';

        }
    );

}

/* =========================================================
   KEY ACTION
   ========================================================= */

function keyAction(
    endpoint,
    id
){

    request(
        "POST",
        endpoint,
        {id:id},

        function(){

            loadKeys();

        },

        function(error){

            alert(error);

        }
    );

}

/* =========================================================
   EVENTS
   ========================================================= */

$("menuButton").addEventListener(
    "click",
    openMenu
);

$("closeMenu").addEventListener(
    "click",
    closeMenu
);

$("overlay").addEventListener(
    "click",
    closeMenu
);

document
    .querySelectorAll("[data-page]")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                showPage(
                    this.dataset.page
                );

            }
        );

    });

$("sendButton").addEventListener(
    "click",
    runAgent
);

$("prompt").addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            runAgent();

        }

    }
);

$("prompt").addEventListener(
    "input",
    function(){

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);

$("clearActivity").addEventListener(
    "click",
    function(){

        state.events = [];

        renderActivity();

    }
);

$("clearTerminal").addEventListener(
    "click",
    function(){

        state.terminal = "";

        $("terminalOutput")
            .textContent = "";

    }
);

$("refreshFiles").addEventListener(
    "click",
    loadFiles
);

$("newChat").addEventListener(
    "click",
    function(){

        request(
            "POST",
            "/chats/new",
            {},

            function(){

                loadChats();

            },

            function(error){

                alert(error);

            }
        );

    }
);

/* =========================================================
   ADD KEY
   ========================================================= */

$("addKey").addEventListener(
    "click",
    function(){

        const name =
            $("keyName")
            .value
            .trim() ||
            "Gemini Key";

        const apiKey =
            $("keyValue")
            .value
            .trim();

        if(!apiKey){

            alert(
                "Gemini API key is required."
            );

            return;

        }

        request(
            "POST",
            "/keys",
            {
                name:name,
                apiKey:apiKey
            },

            function(){

                $("keyName").value = "";

                $("keyValue").value = "";

                loadKeys();

                alert(
                    "Key added successfully."
                );

            },

            function(error){

                alert(error);

            }
        );

    }
);

/* =========================================================
   KEY LIST BUTTONS
   ========================================================= */

$("keyList").addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest("button");

        if(!button){
            return;
        }

        const id =
            button.dataset.id;

        if(!id){
            return;
        }

        if(
            button.classList.contains(
                "useKey"
            )
        ){

            keyAction(
                "/keys/use",
                id
            );

            return;

        }

        if(
            button.classList.contains(
                "stopKey"
            )
        ){

            const enable =
                button.textContent
                .trim()
                === "Enable";

            keyAction(
                enable
                ? "/keys/enable"
                : "/keys/stop",
                id
            );

            return;

        }

        if(
            button.classList.contains(
                "deleteKey"
            )
        ){

            if(
                !confirm(
                    "Delete this key?"
                )
            ){

                return;

            }

            request(
                "DELETE",
                "/keys/" +
                encodeURIComponent(id),
                undefined,

                function(){

                    loadKeys();

                },

                function(error){

                    alert(error);

                }
            );

        }

    }
);

/* =========================================================
   INITIALIZE
   ========================================================= */

renderActivity();

showPage("home");

loadHealth();

})();
</script>
