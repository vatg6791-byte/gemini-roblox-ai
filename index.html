<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>AI Agent</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
    background:#07080d;
    color:#f5f7ff;
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    overflow:hidden;
}


/* =====================================================
   SIDEBAR
===================================================== */

#sidebar{
    position:fixed;
    top:0;
    right:0;
    width:310px;
    max-width:88%;
    height:100%;
    z-index:100;
    background:
        linear-gradient(
            180deg,
            rgba(18,20,31,.99),
            rgba(8,9,15,.99)
        );
    border-left:1px solid rgba(255,255,255,.08);
    transform:translateX(100%);
    transition:.25s ease;
    padding:18px;
    overflow-y:auto;
}

#sidebar.open{
    transform:translateX(0);
}

.sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.close-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
}

.new-chat{
    width:100%;
    height:48px;
    border-radius:14px;
    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #8c4dff
        );
    font-weight:800;
    cursor:pointer;
    margin-bottom:16px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav button{
    width:100%;
    height:46px;
    padding:0 14px;
    border-radius:13px;
    background:transparent;
    text-align:right;
    cursor:pointer;
}

.nav button.active{
    background:rgba(255,255,255,.08);
}

.section-title{
    font-size:12px;
    opacity:.45;
    margin:
        22px 6px 9px;
}

.chat-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.chat-item{
    padding:11px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    overflow:hidden;
}

.chat-item:active{
    background:rgba(255,255,255,.09);
}

.chat-item-title{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item-project{
    margin-top:4px;
    font-size:10px;
    opacity:.45;
}


/* =====================================================
   OVERLAY
===================================================== */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);
    z-index:90;
    display:none;
}

#overlay.show{
    display:block;
}


/* =====================================================
   MAIN
===================================================== */

#main{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:62px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        0 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(8,9,14,.85);
    backdrop-filter:blur(20px);
}

.topbar-title{
    font-weight:800;
    font-size:16px;
}

.menu-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
    font-size:21px;
}

.menu-btn:active{
    transform:scale(.94);
}

.status{
    font-size:11px;
    opacity:.55;
}


/* =====================================================
   WORKSPACE
===================================================== */

#workspace{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:16px;
    padding-bottom:170px;
}

.page{
    display:none;
    min-height:100%;
}

.page.active{
    display:block;
}


/* =====================================================
   HOME
===================================================== */

.home-empty{
    min-height:
        calc(100vh - 240px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    opacity:.9;
}

.home-icon{
    width:76px;
    height:76px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            rgba(112,92,255,.28),
            rgba(155,70,255,.18)
        );
    border:1px solid rgba(255,255,255,.1);
    font-size:30px;
    margin-bottom:18px;
}

.home-empty h1{
    margin:0;
    font-size:25px;
}

.home-empty p{
    margin-top:9px;
    opacity:.45;
    font-size:13px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.message{
    max-width:92%;
    padding:13px 15px;
    border-radius:17px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message.user{
    align-self:flex-start;
    background:
        linear-gradient(
            135deg,
            #5d4de9,
            #7846df
        );
    border-bottom-left-radius:5px;
}

.message.assistant{
    align-self:flex-end;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    border-bottom-right-radius:5px;
}


/* =====================================================
   ACTIVITY
===================================================== */

.activity-card{
    margin-top:14px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    background:rgba(255,255,255,.035);
    overflow:hidden;
}

.activity-head{
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
}

.activity-title{
    font-weight:800;
}

.activity-arrow{
    transition:.2s;
}

.activity-card.closed .activity-arrow{
    transform:rotate(180deg);
}

.activity-body{
    border-top:1px solid rgba(255,255,255,.06);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.activity-card.closed .activity-body{
    display:none;
}

.activity-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:12px;
}

.activity-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#7d6cff;
    margin-top:6px;
    flex:none;
}

.activity-text{
    opacity:.75;
}

.activity-tool{
    font-family:monospace;
    direction:ltr;
    text-align:left;
    opacity:.55;
}


/* =====================================================
   FILES
===================================================== */

.file-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.file-toolbar button{
    width:38px;
    height:38px;
    border-radius:11px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
}

.file-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.file{
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    direction:ltr;
    text-align:left;
}

.file:active{
    background:rgba(255,255,255,.08);
}

.file-size{
    opacity:.4;
    font-size:10px;
    margin-top:3px;
}


/* =====================================================
   CODE VIEW
===================================================== */

.code-view{
    margin-top:14px;
    border-radius:16px;
    background:#05060a;
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
}

.code-head{
    padding:10px 13px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:12px;
    direction:ltr;
    text-align:left;
}

pre{
    margin:0;
    padding:15px;
    overflow:auto;
    direction:ltr;
    text-align:left;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
    font-size:12px;
    line-height:1.6;
}


/* =====================================================
   TERMINAL
===================================================== */

.terminal-box{
    border-radius:17px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:#030407;
}

.terminal-head{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    background:rgba(255,255,255,.04);
}

.terminal-title{
    font-family:monospace;
    font-size:12px;
}

.terminal-actions{
    display:flex;
    gap:6px;
}

.terminal-actions button{
    width:30px;
    height:30px;
    border-radius:8px;
    background:rgba(255,255,255,.07);
    cursor:pointer;
}

#terminalOutput{
    min-height:300px;
    max-height:65vh;
    overflow:auto;
    padding:15px;
    direction:ltr;
    text-align:left;
    font-family:monospace;
    font-size:12px;
    white-space:pre-wrap;
}


/* =====================================================
   KEYS
===================================================== */

.keys-header{
    margin-bottom:15px;
}

.keys-header h2{
    margin:
        0 0 7px;
}

.keys-header p{
    margin:0;
    opacity:.45;
    font-size:12px;
    line-height:1.6;
}

.key-card{
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    margin-bottom:10px;
}

.key-card.active{
    border-color:rgba(124,92,255,.7);
    box-shadow:
        0 0 25px rgba(100,70,255,.08);
}

.key-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.key-name{
    font-weight:800;
}

.key-badge{
    padding:5px 8px;
    border-radius:8px;
    font-size:9px;
    background:rgba(124,92,255,.15);
    color:#b9afff;
}

.key-value{
    margin-top:7px;
    direction:ltr;
    text-align:left;
    font-family:monospace;
    font-size:11px;
    opacity:.5;
}

.key-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.key-actions button{
    flex:1;
    min-height:40px;
    border-radius:11px;
    background:rgba(255,255,255,.07);
    cursor:pointer;
    font-size:12px;
}

.key-actions .use{
    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #8d4cff
        );
}

.key-actions .danger{
    background:rgba(239,68,68,.12);
    color:#ff8d8d;
}

.key-actions .success{
    background:rgba(34,197,94,.12);
    color:#8ff0ad;
}


/* =====================================================
   ADD KEY
===================================================== */

.add-key-box{
    margin-top:16px;
    padding:15px;
    border-radius:17px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
}

.add-key-box h3{
    margin:
        0 0 12px;
    font-size:14px;
}

.key-input{
    width:100%;
    height:44px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    background:rgba(0,0,0,.25);
    color:white;
    padding:0 12px;
    margin-bottom:8px;
}

.key-input:focus{
    border-color:rgba(124,92,255,.65);
}

.add-key-btn{
    width:100%;
    height:44px;
    border-radius:12px;
    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #8c4dff
        );
    font-weight:800;
    cursor:pointer;
}


/* =====================================================
   COMPOSER
===================================================== */

#composer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    padding:
        10px 12px
        calc(10px + env(safe-area-inset-bottom));
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(7,8,13,.94) 28%
        );
}

.composer-inner{
    max-width:900px;
    margin:auto;
    padding:9px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    border-radius:20px;
    background:
        rgba(20,21,31,.94);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
        0 15px 50px rgba(0,0,0,.4);
    backdrop-filter:blur(22px);
}

#prompt{
    flex:1;
    min-height:44px;
    max-height:150px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:
        11px 8px;
    line-height:1.5;
}

#prompt::placeholder{
    color:rgba(255,255,255,.3);
}

.send-btn,
.stop-btn{
    width:45px;
    height:45px;
    border-radius:14px;
    cursor:pointer;
    flex:none;
}

.send-btn{
    background:
        linear-gradient(
            135deg,
            #6e5cff,
            #984fff
        );
}

.stop-btn{
    display:none;
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #b91c1c
        );
}

body.running .send-btn{
    display:none;
}

body.running .stop-btn{
    display:block;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(
    min-width:800px
){

    #workspace{
        padding-left:20%;
        padding-right:20%;
    }

    #composer{
        padding-left:20%;
        padding-right:20%;
    }
}

</style>

</head>

<body>

<div id="app">


<!-- ===================================================
     SIDEBAR
=================================================== -->

<aside id="sidebar">

    <div class="sidebar-top">

        <div class="logo">
            AI Agent
        </div>

        <button
            class="close-btn"
            id="closeSidebar"
        >
            ×
        </button>

    </div>


    <button
        class="new-chat"
        id="newChat"
    >
        ＋ New Chat
    </button>


    <div class="nav">

        <button
            data-page="home"
            class="active"
        >
            🏠 Home
        </button>

        <button
            data-page="chats"
        >
            💬 Chats
        </button>

        <button
            data-page="files"
        >
            📁 Files
        </button>

        <button
            data-page="activity"
        >
            ⚡ Agent Activity
        </button>

        <button
            data-page="terminal"
        >
            ⌘ Terminal
        </button>

        <button
            data-page="keys"
        >
            🔑 Keys
        </button>

    </div>


    <div class="section-title">
        Recent Chats
    </div>

    <div
        class="chat-list"
        id="chatList"
    ></div>

</aside>


<div id="overlay"></div>


<!-- ===================================================
     MAIN
=================================================== -->

<main id="main">


<header class="topbar">

    <button
        class="menu-btn"
        id="menuBtn"
    >
        ☰
    </button>

    <div
        class="topbar-title"
        id="topTitle"
    >
        AI Agent
    </div>

    <div
        class="status"
        id="status"
    >
        Ready
    </div>

</header>


<div id="workspace">


<!-- ===================================================
     HOME
=================================================== -->

<section
    class="page active"
    id="page-home"
>

    <div
        id="homeEmpty"
        class="home-empty"
    >

        <div class="home-icon">
            ✦
        </div>

        <h1>
            What can I build?
        </h1>

        <p>
            Your AI Agent is ready.
        </p>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <div
        id="activityContainer"
    ></div>

</section>


<!-- ===================================================
     CHATS
=================================================== -->

<section
    class="page"
    id="page-chats"
>

    <h2>
        Chats
    </h2>

    <div
        class="chat-list"
        id="fullChatList"
    ></div>

</section>


<!-- ===================================================
     FILES
=================================================== -->

<section
    class="page"
    id="page-files"
>

    <div class="file-toolbar">

        <strong>
            Project Files
        </strong>

        <button
            id="refreshFilesBtn"
        >
            ↻
        </button>

    </div>

    <div
        class="file-list"
        id="fileList"
    ></div>

    <div
        id="codeView"
    ></div>

</section>


<!-- ===================================================
     ACTIVITY
=================================================== -->

<section
    class="page"
    id="page-activity"
>

    <h2>
        Agent Activity
    </h2>

    <div
        id="fullActivity"
    ></div>

</section>


<!-- ===================================================
     TERMINAL
=================================================== -->

<section
    class="page"
    id="page-terminal"
>

    <div class="terminal-box">

        <div class="terminal-head">

            <div class="terminal-title">
                agent@project:~
            </div>

            <div class="terminal-actions">

                <button
                    id="clearTerminal"
                >
                    ×
                </button>

            </div>

        </div>

        <div
            id="terminalOutput"
        ></div>

    </div>

</section>


<!-- ===================================================
     KEYS
=================================================== -->

<section
    class="page"
    id="page-keys"
>

    <div class="keys-header">

        <h2>
            🔑 API Keys
        </h2>

        <p>
            مفتاح Render الأساسي يبقى Primary.
            يمكنك إضافة مفاتيح Gemini أخرى واختيارها يدويًا.
        </p>

    </div>


    <div
        id="keysList"
    ></div>


    <div class="add-key-box">

        <h3>
            ＋ Add Gemini Key
        </h3>

        <input
            class="key-input"
            id="keyName"
            type="text"
            placeholder="اسم المفتاح — مثال: Gemini Project 2"
        >

        <input
            class="key-input"
            id="keyValue"
            type="password"
            placeholder="ضع Gemini API Key هنا"
            dir="ltr"
        >

        <button
            class="add-key-btn"
            id="addKeyBtn"
        >
            Add & Save Key
        </button>

    </div>

</section>


</div>


<!-- ===================================================
     COMPOSER
=================================================== -->

<div id="composer">

    <div class="composer-inner">

        <textarea
            id="prompt"
            placeholder="اشرح لي وش تبي أبني..."
            rows="1"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
        >
            ↑
        </button>

        <button
            class="stop-btn"
            id="stopBtn"
        >
            ■
        </button>

    </div>

</div>


</main>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://gemini-roblox-ai.onrender.com";


/* =====================================================
   STATE
===================================================== */

let currentChatId =
    localStorage.getItem(
        "currentChatId"
    );

let currentProject =
    localStorage.getItem(
        "currentProject"
    ) || "default";

let currentJobId =
    null;

let running =
    false;

let activityItems =
    [];


/* =====================================================
   ELEMENTS
===================================================== */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const closeSidebar =
    document.getElementById(
        "closeSidebar"
    );

const newChatBtn =
    document.getElementById(
        "newChat"
    );

const prompt =
    document.getElementById(
        "prompt"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const messages =
    document.getElementById(
        "messages"
    );

const homeEmpty =
    document.getElementById(
        "homeEmpty"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const topTitle =
    document.getElementById(
        "topTitle"
    );

const chatList =
    document.getElementById(
        "chatList"
    );

const fullChatList =
    document.getElementById(
        "fullChatList"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const codeView =
    document.getElementById(
        "codeView"
    );

const terminalOutput =
    document.getElementById(
        "terminalOutput"
    );

const activityContainer =
    document.getElementById(
        "activityContainer"
    );

const fullActivity =
    document.getElementById(
        "fullActivity"
    );

const keysList =
    document.getElementById(
        "keysList"
    );

const keyName =
    document.getElementById(
        "keyName"
    );

const keyValue =
    document.getElementById(
        "keyValue"
    );

const addKeyBtn =
    document.getElementById(
        "addKeyBtn"
    );


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

    sidebar.classList.add(
        "open"
    );

    overlay.classList.add(
        "show"
    );

    loadChats();

    loadKeys();
}


function closeSidebarMenu(){

    sidebar.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );
}


menuBtn.onclick =
    openSidebar;

closeSidebar.onclick =
    closeSidebarMenu;

overlay.onclick =
    closeSidebarMenu;


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(
    page
){

    document
        .querySelectorAll(".page")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    const target =
        document.getElementById(
            `page-${page}`
        );


    if(target){

        target.classList.add(
            "active"
        );
    }


    document
        .querySelectorAll(".nav button")
        .forEach(
            button => {

async function openChat(

                )}`
            );


        const data =
            await response.json();


        if(!data.ok){

        currentChatId =

            currentChatId

        localStorage.setItem(
            "currentProject",

        );


        messages.innerHTML =
            "";

        activityContainer.innerHTML =
            "";

        activityItems =
            [];


        topTitle.textContent =

/* =====================================================
   SEND
===================================================== */

async function sendPrompt(){

    const text =
        prompt.value.trim();


    if(!text){

        return;
    }


    if(running){

        return;
    }


    if(!currentChatId){

        await newChat();
    }


    prompt.value =
        "";


    autoResize();


    addMessage(
        "user",
        text
    );


    activityItems =
        [];


    activityContainer.innerHTML =
        "";


    running =
        true;


    document.body.classList.add(
        "running"
    );


    statusEl.textContent =
        "Agent running";


    showPage(
        "home"
    );


    try {

        const response =
            await fetch(
                `${API_URL}/agent`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        chatId:
                            currentChatId,

                        project:
                            currentProject,

                        prompt:
                            text
                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            throw new Error(
                errorText ||
                `HTTP ${response.status}`
            );
        }


        if(!response.body){

            throw new Error(
                "المتصفح لم يستلم Stream من السيرفر."
            );
        }


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        let buffer =
            "";


        while(true){

            const {
                value,
                done
            } =
                await reader.read();


            if(done){

                break;
            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop() ||
                "";


            for(
                const line of lines
            ){

                if(!line.trim()){

                    continue;
                }


                let event;


                try {

                    event =
                        JSON.parse(
                            line
                        );

                } catch {

                    continue;
                }


                handleAgentEvent(
                    event
                );
            }


            if(!running){

                break;
            }
        }


    } catch(error){

        if(running){

            addActivity(
                "حدث خطأ أثناء الاتصال بالـAgent"
            );


            addMessage(
                "assistant",
                error.message
            );
        }

    } finally {

        running =
            false;


        document.body.classList.remove(
            "running"
        );


        statusEl.textContent =
            "Ready";


        currentJobId =
            null;


        showPage(
            "home"
        );


        loadChats();
    }
}


/* =====================================================
   HANDLE EVENTS
===================================================== */

function handleAgentEvent(
    event
){

    switch(
        event.type
    ){

        case "connected":

            currentJobId =
                event.jobId;


            addActivity(
                "Agent connected"
            );

            break;


        case "start":

            addActivity(
                `Project: ${event.project}`
            );


            if(
                event.keyName
            ){

                addActivity(
                    `Active AI Key: ${event.keyName}`
                );
            }

            break;


        case "thinking":

            addActivity(
                `Planning next step — Step ${event.step}`
            );

            break;


        case "planning":

            addActivity(
                event.message ||
                "Planning next step"
            );

            break;


        case "tool_start":

            addActivity(
                event.message ||
                `Running ${event.tool}`,
                event.tool
            );

            break;


        case "tool_result":

            addActivity(
                `Completed: ${event.tool}`,
                event.tool
            );


            if(
                event.tool ===
                "terminal" &&
                event.result
            ){

                if(
                    event.result.stdout
                ){

                    terminalLog(
                        event.result.stdout
                    );
                }


                if(
                    event.result.stderr
                ){

                    terminalLog(
                        event.result.stderr
                    );
                }
            }

            break;


        case "tool_error":

            addActivity(
                `Error: ${event.error}`,
                event.tool
            );


            terminalLog(
                `[ERROR] ${
                    event.error
                }`
            );

            break;


        case "final":

            if(
                event.message
            ){

                addMessage(
                    "assistant",
                    event.message
                );
            }


            addActivity(
                "Agent finished"
            );

            break;


        case "stopped":

            addActivity(
                "Agent stopped by user"
            );


            addMessage(
                "assistant",
                "تم إيقاف المهمة."
            );

            break;


        case "error":

            addActivity(
                `Error: ${event.message}`
            );


            addMessage(
                "assistant",
                event.message ||
                "حدث خطأ."
            );

            break;


        case "done":

            statusEl.textContent =
                "Completed";

            break;
    }
}


/* =====================================================
   STOP
===================================================== */

async function stopCurrentAgent(){

    if(!currentJobId){

        running =
            false;

        document.body.classList.remove(
            "running"
        );

        return;
    }


    const oldJob =
        currentJobId;


    try {

        await fetch(
            `${API_URL}/agent/stop`,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    jobId:
                        oldJob
                })
            }
        );

    } catch {}


    running =
        false;


    document.body.classList.remove(
        "running"
    );


    statusEl.textContent =
        "Stopped";


    currentJobId =
        null;
}

        ){

            fileList.innerHTML =

                 </div>`;

            return;
        }


        data.files.forEach(
            file => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "file";


                element.innerHTML = `

                    <div>
                        ${
                            file.type ===
                            "folder"
                            ? "📁 "
                            : "📄 "

                        undefined
                        ?

function renderKeys(
    data
){

    keysList.innerHTML =
        "";


    /*
     * PRIMARY
     */

    const primaryActive =
        data.activeId ===
        "primary";


    const primary =
        document.createElement(
            "div"
        );


    primary.className =
        "key-card" +
        (
            primaryActive
            ? " active"
            : ""
        );


    primary.innerHTML = `

        <div class="key-top">

            <div class="key-name">
                Render Primary
            </div>

            <div class="key-badge">
                PRIMARY
            </div>

        </div>

        <div class="key-value">
            ${escapeHTML(
                data.primary.masked
            )}
        </div>

        <div class="key-actions">

            <button
                class="use"
                onclick="useKey('primary')"
            >
                ${
                    primaryActive
                    ? "✓ Using"
                    : "Use Primary"
                }
            </button>

        </div>

    `;


    keysList.appendChild(
        primary
    );


    /*
     * SAVED KEYS
     */

    if(
        !data.keys ||
        !data.keys.length
    ){

        return;
    }


    data.keys.forEach(
        key => {

            const active =
                data.activeId ===
                key.id;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "key-card" +
                (
                    active
                    ? " active"
                    : ""
                );


            const isEnabled =
                key.enabled !== false;


            card.innerHTML = `

                <div class="key-top">

                    <div class="key-name">
                        ${escapeHTML(
                            key.name
                        )}
                    </div>

                    <div class="key-badge">
                        ${
                            active
                            ? "ACTIVE"
                            : (
                                isEnabled
                                ? "SAVED"
                                : "STOPPED"
                            )
                        }
                    </div>

                </div>

                <div class="key-value">
                    ${escapeHTML(
                        key.masked
                    )}
                </div>

                <div class="key-actions">

                    ${
                        isEnabled
                        ?
                        `
                        <button
                            class="use"
                            onclick="useKey('${key.id}')"
                        >
                            ${
                                active
                                ? "✓ Using"
                                : "Use"
                            }
                        </button>

                        <button
                            class="danger"
                            onclick="stopKey('${key.id}')"
                        >
                            Stop
                        </button>
                        `
                        :
                        `
                        <button
                            class="success"
                            onclick="enableKey('${key.id}')"
                        >
                            Enable
                        </button>
                        `
                    }

                    <button
                        class="danger"
                        onclick="deleteKey('${key.id}')"
                    >
                        Delete
                    </button>

                </div>

            `;


            keysList.appendChild(
                card
            );
        }
    );
}

/* =====================================================
   ADD KEY
===================================================== */

async function addKey(){

    const name =
        keyName.value.trim();


    const key =
        keyValue.value.trim();


    if(!name){

        alert(
            "اكتب اسم المفتاح."
        );

        keyName.focus();

        return;
    }


    if(!key){

        alert(
            "ضع Gemini API Key."
        );

        keyValue.focus();

        return;
    }


    addKeyBtn.disabled =
        true;


    addKeyBtn.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                `${API_URL}/keys`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        name,

                        key
                    })
                }
            );


        const data =
            await response.json();


        if(!data.ok){

            throw new Error(
                data.error
            );
        }


        keyName.value =
            "";

        keyValue.value =
            "";


        await loadKeys();


        alert(
            "تم حفظ المفتاح بنجاح."
        );


    } catch(error){

        alert(
            error.message
        );

    } finally {

        addKeyBtn.disabled =
            false;

        addKeyBtn.textContent =
            "Add & Save Key";
    }
}


addKeyBtn.onclick =
    addKey;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}
